; PHP limits for order-log.php document backups.
;
; HostGator (and most shared hosts) run PHP as FPM/CGI, where php_value lines in
; .htaccess are ignored — this file is the mechanism that actually applies.
; Changes take up to 5 minutes to take effect (user_ini.cache_ttl defaults to 300s).
;
; Per-document cap is 25MB (MAX_FILE_BYTES in order-form.php) and files upload
; one per request, so these stay modest.

upload_max_filesize = 26M
post_max_size = 28M
memory_limit = 128M
max_execution_time = 120
